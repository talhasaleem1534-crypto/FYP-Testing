global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI /metrics: request counts/latency and anomaly verdict counters
  - job_name: "ai-engine"
    static_configs:
      - targets: ["ai-engine:8001"]

  # Traefik's own metrics (requests per router, status codes, ...)
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8080"]
