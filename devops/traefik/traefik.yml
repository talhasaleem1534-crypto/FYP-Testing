api:
  dashboard: true
  insecure: true      # dashboard on :8080 without auth - docker-compose publishes it on 127.0.0.1 only

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "paas-net"

metrics:
  prometheus: {}

# Used only by apps whose labels set tls.certresolver (TRAEFIK_ENABLE_TLS=true).
# Replace the e-mail with a real one before requesting certificates.
certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@example.com"
      storage: "/acme/acme.json"
      httpChallenge:
        entryPoint: "web"
